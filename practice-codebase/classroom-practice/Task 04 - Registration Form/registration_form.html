<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>

<body>
    <h1 align="center">Student Registration Form</h1>
    <form>
        <table border="1" width="80%" align="center">
            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td>Full Name</td>
                <td><input type="text" name="name" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email" placeholder="Enter your email"></td>
            </tr>
            <tr>
                <td>Phone Number</td>
                <td><input type="tel" name="phone" placeholder="Enter your phone number"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="female">Female
                    <input type="radio" name="gender" value="other">Other
                </td>
            </tr>
            <tr>
                <td>Skills</td>
                <td><input type="checkbox" name="skill" value="html">HTML
                    <input type="checkbox" name="skill" value="css">CSS
                    <input type="checkbox" name="skill" value="javascript">JavaScript
                </td>
            </tr>
            <tr>
                <td>Course</td>
                <td><select name="course">
                        <option>Select Course</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea name="address" rows="5" cols="30"></textarea></td>
            </tr>
            <tr>
                <td>Upload Resume</td>
                <td><input type="file" name="resume"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><button type="submit">Register</button> <button type="reset">Reset</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
