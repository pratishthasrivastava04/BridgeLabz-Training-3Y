<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload Form</title>
</head>
<body>

  <h1>Upload Your Profile Picture</h1>

  <form>
    <label for="profile-pic">Choose a file:</label>
    <input type="file" id="profile-pic" name="profile-pic" accept=".jpg,.png">
    <br><br>

    <p>Only .jpg and .png image files are allowed for upload.</p>

    <button type="submit">Upload</button>
  </form>

</body>
</html>
