<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<body>

  <h1>Login</h1>

  <form>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br><br>

    <!-- A CSRF (Cross-Site Request Forgery) token is a unique, secret value
         generated by the server and included in the form as a hidden field.
         When the form is submitted, the server checks if this token matches
         the one it generated. This helps ensure that the request actually
         came from the legitimate website and not from a malicious site
         tricking the user's browser into submitting the form. -->
    <input type="hidden" name="csrf_token" value="dummyCSRFTokenValue12345">

    <button type="submit">Login</button>
  </form>

</body>
</html>
