<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="q5_selectors.css">
</head>
<body>

  <h1>CSS Selectors Showcase</h1>

  <div class="form-demo">
    <input type="text" placeholder="Text input">
    <input type="email" placeholder="Email input">
    <a href="https://example.com">Secure Link</a>
    <a href="page.html">Internal Link</a>
  </div>

  <ul class="item-list">
    <li>First Item</li>
    <li>Second Item</li>
    <li>Third Item</li>
    <li>Fourth Item</li>
  </ul>

  <div class="parent">
    <p>Direct child paragraph</p>
    <div>
      <p>Nested paragraph (not a direct child)</p>
    </div>
  </div>

</body>
</html>
