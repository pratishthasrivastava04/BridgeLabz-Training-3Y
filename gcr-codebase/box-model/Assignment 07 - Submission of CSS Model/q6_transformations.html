<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6_transformations.css">
</head>
<body>

  <h1>Transformation Effects</h1>

  <div class="container">

    <div class="item-wrapper">
      <div class="box rotate-box">Rotate</div>
      <p>rotate()</p>
    </div>

    <div class="item-wrapper">
      <div class="box scale-box">Scale</div>
      <p>scale()</p>
    </div>

    <div class="item-wrapper">
      <div class="box translate-box">Translate</div>
      <p>translate()</p>
    </div>

    <div class="item-wrapper">
      <div class="box skew-box">Skew</div>
      <p>skew()</p>
    </div>

  </div>

</body>
</html>
