
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer Banner</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        main {
            max-width: 700px;
            margin: auto;
        }

        .banner {
            padding: 30px;
            margin: 15px;
            border-radius: 10px;
            color: white;
            background-color: #2874a6;
        }

        #banner2 {
            background-color: #e67e22;
        }

        #banner3 {
            background-color: #27ae60;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>Special Offers</h1>
        <p>Grab exciting deals and discounts!</p>
    </header>

    <main>

        <section id="banner1" class="banner">
            <h2>50% OFF</h2>
            <p>Special discount on all electronics.</p>
        </section>

        <section id="banner2" class="banner">
            <h2>Buy 1 Get 1 Free</h2>
            <p>Exciting offers on selected products.</p>
        </section>

        <section id="banner3" class="banner">
            <h2>Free Delivery</h2>
            <p>Free shipping on orders above ₹999.</p>
        </section>

        <section>
            <h2>Banner Controls</h2>

            <button id="hide">Hide</button>
            <button id="show">Show</button>

            <button id="slideUp">Slide Up</button>
            <button id="slideDown">Slide Down</button>

            <button id="fadeOut">Fade Out</button>
            <button id="fadeIn">Fade In</button>
        </section>

    </main>

    <footer>
        <p>© 2026 Shopping Website</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
