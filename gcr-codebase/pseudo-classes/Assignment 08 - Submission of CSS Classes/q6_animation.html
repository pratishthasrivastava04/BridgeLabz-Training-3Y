<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="q6_animation.css">
</head>
<body>

  <h1>Animation Examples</h1>

  <div class="animation-row">

    <div class="anim-item">
      <div class="moving-box"></div>
      <p>Moving Box</p>
    </div>

    <div class="anim-item">
      <div class="bouncing-ball"></div>
      <p>Bouncing Ball</p>
    </div>

    <div class="anim-item">
      <p class="color-text">Changing Color</p>
    </div>

  </div>

</body>
</html>
