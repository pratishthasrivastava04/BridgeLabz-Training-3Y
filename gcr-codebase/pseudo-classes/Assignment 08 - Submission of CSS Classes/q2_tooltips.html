<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2_tooltips.css">
</head>
<body>

  <h1>Tooltip Examples</h1>

  <div class="tooltip-row">

    <div class="tooltip-wrapper">
      <span class="icon">&#9733;</span>
      <span class="tooltip-text">This is a star icon</span>
    </div>

    <div class="tooltip-wrapper">
      <button class="tooltip-btn">Save</button>
      <span class="tooltip-text">Click to save your changes</span>
    </div>

    <div class="tooltip-wrapper">
      <span class="word">Hover me</span>
      <span class="tooltip-text">Additional information appears here</span>
    </div>

  </div>

</body>
</html>
