<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-Classes Demo</title>
  <link rel="stylesheet" href="q1_pseudo_classes.css">
</head>
<body>

  <h1>Pseudo-Classes Showcase</h1>

  <div class="demo-row">
    <div class="demo-item">
      <a href="#" class="demo-link">Hover Link</a>
      <p>:hover</p>
    </div>

    <div class="demo-item">
      <input type="text" placeholder="Click to focus" class="demo-input">
      <p>:focus</p>
    </div>

    <div class="demo-item">
      <button class="demo-button">Click Me</button>
      <p>:active</p>
    </div>

    <div class="demo-item">
      <ul class="demo-list">
        <li>Item One</li>
        <li>Item Two</li>
        <li>Item Three</li>
      </ul>
      <p>:nth-child()</p>
    </div>
  </div>

</body>
</html>
