<!DOCTYPE html>
<html>
<head>
    <title>Client-Server Model</title>
</head>
<body>

    <header>
        <h1>Client-Server Model in Web Architecture</h1>
    </header>

        <table border="1" cellpadding="15">
            <tr>
                <th>Client</th>
                <th>Direction</th>
                <th>Server</th>
            </tr>
            <tr>
                <td>Sends Request<br>(e.g. Browser)</td>
                <td><strong>&#8594; Request &#8594;</strong></td>
                <td>Receives Request<br>(Processes it)</td>
            </tr>
            <tr>
                <td>Receives Response<br>(Displays Data)</td>
                <td><strong>&#8592; Response &#8592;</strong></td>
                <td>Sends Response<br>(Sends back data)</td>
            </tr>
        </table>

</body>
</html>
