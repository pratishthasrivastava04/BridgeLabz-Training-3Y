<!DOCTYPE html>
<html>
<head>
    <title>Web Architecture Flow</title>
</head>
<body>

    <header>
        <h1>Basic Web Architecture Flow</h1>
    </header>

        <table border="1" cellpadding="15">
            <tr>
                <th>Client</th>
                <th></th>
                <th>API</th>
                <th></th>
                <th>Server</th>
                <th></th>
                <th>Database</th>
            </tr>
            <tr>
                <td><b>Browser / App</b><br>(User Interface)</td>
                <td><strong>&#8594;</strong></td>
                <td><b>Handles Requests</b><br>(Communication Layer)</td>
                <td><strong>&#8594;</strong></td>
                <td><b>Backend Logic</b><br>(Processes Data)</td>
                <td><strong>&#8594;</strong></td>
                <td><b>Stores Data</b><br>(MySQL, MongoDB, etc.)</td>
            </tr>
            <tr>
                <td colspan="7"><strong><center>&#8592; Response flows back from Database to Server to API to Client &#8592;</center></strong></td>
            </tr>
        </table>

</body>
</html>
