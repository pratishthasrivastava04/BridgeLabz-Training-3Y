<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

  <h1>Filter Gallery</h1>

  <div class="gallery">

    <figure>
      <img src="img1.jpg" alt="Blur filter" class="blur-img">
      <figcaption>Blur</figcaption>
    </figure>

    <figure>
      <img src="img2.jpg" alt="Grayscale filter" class="grayscale-img">
      <figcaption>Grayscale</figcaption>
    </figure>

    <figure>
      <img src="img3.jpg" alt="Sepia filter" class="sepia-img">
      <figcaption>Sepia</figcaption>
    </figure>

    <figure>
      <img src="img4.jpg" alt="Brightness filter" class="brightness-img">
      <figcaption>Brightness</figcaption>
    </figure>

    <figure>
      <img src="img5.jpg" alt="Contrast filter" class="contrast-img">
      <figcaption>Contrast</figcaption>
    </figure>

    <figure>
      <img src="img6.jpg" alt="Hue rotate filter" class="hue-img">
      <figcaption>Hue Rotate</figcaption>
    </figure>

  </div>

</body>
</html>
