<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 60px 16px; text-align: center; }
    .dropdown { position: relative; display: inline-block; width: 220px; text-align: left; }
    #dropdownBtn { width: 100%; padding: 10px 14px; font-size: 15px; background: #fff; border: 1px solid #bbb; border-radius: 6px; cursor: pointer; text-align: left; }
    #dropdownList { position: absolute; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 0; list-style: none; background: #fff; border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
    #dropdownList.hidden { display: none; }
    #dropdownList li { padding: 10px 14px; cursor: pointer; }
    #dropdownList li:hover { background: #e8f0fe; }
  </style>
</head>
<body>
  <h1>Custom Dropdown</h1>

  <div class="dropdown" id="dropdown">
    <button id="dropdownBtn">Select a fruit</button>
    <ul id="dropdownList" class="hidden">
      <li>Apple</li>
      <li>Banana</li>
      <li>Mango</li>
      <li>Orange</li>
      <li>Grapes</li>
    </ul>
  </div>

  <script src="custom-dropdown.js"></script>
</body>
</html>
