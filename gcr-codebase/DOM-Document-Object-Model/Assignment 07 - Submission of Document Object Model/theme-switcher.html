<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 60px 16px; text-align: center; transition: background 0.3s, color 0.3s; }
    body.theme-light { background: #ffffff; color: #222222; }
    body.theme-dark { background: #1e1e2e; color: #f1f1f1; }
    body.theme-blue { background: #d6e9ff; color: #0b3d91; }
    .card { max-width: 420px; margin: 24px auto; padding: 24px; border-radius: 10px; border: 2px solid currentColor; }
    .buttons { display: flex; justify-content: center; gap: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button[data-theme-value="light"] { background: #f1f1f1; color: #222; border: 1px solid #aaa; }
    button[data-theme-value="dark"] { background: #222; color: #fff; }
    button[data-theme-value="blue"] { background: #2d7ff9; color: #fff; }
  </style>
</head>
<body>
  <h1>Theme Switcher</h1>
  <div class="buttons">
    <button data-theme-value="light">Light</button>
    <button data-theme-value="dark">Dark</button>
    <button data-theme-value="blue">Blue</button>
  </div>
  <div class="card">
    <h2>Sample Card</h2>
    <p>Click a button to change the theme of this page.</p>
    <p>Current theme: <strong id="currentTheme"></strong></p>
  </div>
  <script src="theme-switcher.js"></script>
</body>
</html>
