<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="notifications-dashboard.css">
</head>
<body>

  <div class="container my-5">

    <h1 class="mb-4">Notifications</h1>

    <div class="card p-4">

      <div class="alert alert-success">You have 3 new messages.</div>

      <div class="alert alert-info">Tip: Complete your profile to get better recommendations.</div>

      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Warning: Your subscription expires in 2 days.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="bg-light border rounded p-3 mt-3">
        <h5>Summary</h5>
        <p class="mb-0">You have 1 dismissible warning and 2 informational alerts pending review.</p>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
