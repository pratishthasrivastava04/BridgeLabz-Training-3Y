<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio Basics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">

  <div class="container text-center mt-4 mb-3 p-5">

    <img src="profile.jpg" alt="Profile picture" class="img-fluid rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover;">

    <h1 class="fw-bold">Pratishtha Srivastava</h1>
    <p class="lead">B.Tech AI & Data Science Student | Full-Stack Developer in Training</p>

    <div class="mt-3 mb-4">
      <a href="#" class="btn btn-primary mt-4">Hire Me</a>
      <a href="#" class="btn btn-outline-dark mt-4">Download CV</a>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <form>
          <input type="email" class="form-control mb-3" placeholder="Your email address">
          <textarea class="form-control mb-3" rows="3" placeholder="Send me a message"></textarea>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </div>

  </div>

</body>
</html>
