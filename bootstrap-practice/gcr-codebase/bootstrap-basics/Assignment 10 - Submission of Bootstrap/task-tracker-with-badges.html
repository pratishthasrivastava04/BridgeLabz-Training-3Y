<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body>

  <div class="container my-5">

    <h1 class="mb-4">
      My Tasks
      <span class="badge bg-danger">4 Pending</span>
    </h1>

    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish HTML Assignment
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review CSS Notes
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update Portfolio
        <span class="badge bg-secondary">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Prepare for Mock Interview
        <span class="badge bg-danger">High</span>
      </li>
    </ul>

    <button class="btn btn-success mt-4">
      Completed <span class="badge bg-light text-success ms-1">12</span>
    </button>

  </div>

</body>
</html>
