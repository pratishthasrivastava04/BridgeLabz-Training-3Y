<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="pricing-plans.css">
</head>
<body>

  <div class="container my-5">

    <h1 class="text-center mb-5">Choose Your Plan</h1>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card h-100 shadow-sm pricing-card">
          <div class="card-body text-center">
            <h4 class="card-title">Basic</h4>
            <h2 class="my-3">&#8377;499<small class="text-muted">/mo</small></h2>
            <ul class="list-unstyled">
              <li>5 Projects</li>
              <li>10 GB Storage</li>
              <li>Email Support</li>
            </ul>
            <a href="#" class="btn btn-outline-primary mt-3">Choose Plan</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-lg bg-primary text-white pricing-card">
          <div class="card-body text-center">
            <h4 class="card-title">Pro</h4>
            <h2 class="my-3">&#8377;999<small>/mo</small></h2>
            <ul class="list-unstyled">
              <li>20 Projects</li>
              <li>50 GB Storage</li>
              <li>Priority Support</li>
            </ul>
            <a href="#" class="btn btn-light mt-3">Choose Plan</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm pricing-card">
          <div class="card-body text-center">
            <h4 class="card-title">Premium</h4>
            <h2 class="my-3">&#8377;1999<small class="text-muted">/mo</small></h2>
            <ul class="list-unstyled">
              <li>Unlimited Projects</li>
              <li>200 GB Storage</li>
              <li>24/7 Support</li>
            </ul>
            <a href="#" class="btn btn-outline-primary mt-3">Choose Plan</a>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
